name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep exports out of the checkout so a stray artefact cannot be committed.
  CAD_MCP_OUTPUT_DIR: ${{ github.workspace }}/.cad-output

jobs:
  # Fast feedback: lint and types before spending minutes on geometry.
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy
      # Platform-conditional code (Windows job objects, POSIX rlimits)
      # typechecks differently per platform, and a developer only ever
      # runs one. CI caught ctypes.WinDLL this way on its first run.
      - name: mypy --strict (other platforms)
        run: |
          uv run mypy --platform win32
          uv run mypy --platform darwin

  test:
    name: tests (${{ matrix.os }})
    needs: static
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SPEC N5 names Linux and macOS as supported; Windows is the
        # primary development platform, so all three are exercised.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # Under 30s, and it covers the envelope, argument handling and the
      # error paths -- so a broken PR usually fails here, minutes before
      # the geometry tests finish.
      - name: pytest (fast tier, for quick signal)
        run: uv run pytest -q -m "not geometry and not slow" -n0
      - name: pytest (full, parallel)
        run: uv run pytest -q
      # Wall-clock budgets and timeout probes mean nothing while eleven
      # other workers saturate the CPU, so they sit out the parallel run
      # and get the machine to themselves here.
      - name: pytest (serial — wall-clock budgets and timeouts)
        run: uv run pytest -q -m serial -n0
      - name: smoke (full loop)
        run: uv run python scripts/smoke.py

      # SPEC N4 has a cross-platform half that no single runner can check.
      - name: determinism (separate processes)
        run: >
          uv run python scripts/determinism_check.py
          --json determinism-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: determinism-${{ matrix.os }}.json

  # SPEC N4's cross-platform half. Each `test` job hashed its own exports
  # in two separate processes (that part is a blocking gate); this compares
  # the results between operating systems.
  #
  # Measured 2026-09-14, which settles the question this job was left open
  # to answer: STEP is byte-identical across ubuntu/macos/windows, and
  # STL, 3MF and GLB are not. OCCT tessellation is IEEE-754 arithmetic
  # through libm and `macos-latest` is arm64 while the other runners are
  # x86-64, so a last-ulp difference in a sin/cos used to discretise a
  # fillet moves a vertex and every byte downstream. Exactly that.
  #
  # So SPEC N4 is not tightened, and this does not get promoted to a
  # required check. N4 promises byte-identical exports "across separate
  # processes on a given platform" -- the per-platform half is a blocking
  # gate in each `test` job -- and it never promised cross-OS identity.
  # This used to exit 1 claiming "SPEC N4 violated", putting a red X on
  # every PR for a guarantee nobody made. It now asserts the measured
  # state in both directions instead: STEP regressing fails, and a mesh
  # format unexpectedly agreeing raises a notice, since that would be the
  # trigger to revisit N4.
  determinism-cross-os:
    name: determinism (cross-OS, informational)
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: false
      - name: compare the export hashes across platforms
        run: |
          python - <<'PY'
          import json, pathlib, sys

          # STEP is byte-identical across OSes; the mesh formats are not.
          # Measured 2026-09-14 across ubuntu/macos/windows runners.
          #
          # That is NOT a SPEC N4 violation: N4 promises byte-identical
          # exports "across separate processes on a given platform", and
          # this job used to exit 1 claiming otherwise, which put a red X
          # on every PR for a guarantee nobody made. Tessellation runs
          # through libm; a last-ulp difference in a sin/cos used to
          # discretise a fillet moves a vertex and every byte downstream.
          #
          # So it asserts the *known* state in both directions: STEP
          # regressing is a failure, and the mesh formats unexpectedly
          # agreeing is worth knowing, because that is the trigger to
          # tighten N4 and promote this to a required check.
          CROSS_OS_STABLE = {"step"}

          runs = {}
          for path in sorted(pathlib.Path(".").glob("determinism-*/*.json")):
              runs[path.parent.name] = json.loads(path.read_text())

          if len(runs) < 2:
              sys.exit(f"expected >=2 platforms, got {sorted(runs)}")

          formats = sorted(next(iter(runs.values())))
          regressed, newly_stable = [], []
          for fmt in formats:
              seen = {os_name: h[fmt] for os_name, h in runs.items()}
              identical = len(set(seen.values())) == 1
              expected = fmt in CROSS_OS_STABLE
              print(f"{fmt:5} {'identical' if identical else 'DIFFERS'}"
                    f"{'' if identical == expected else '  <-- CHANGED'}")
              if not identical:
                  for os_name, digest in sorted(seen.items()):
                      print(f"      {os_name:24} {digest}")
              if expected and not identical:
                  regressed.append(fmt)
              if identical and not expected:
                  newly_stable.append(fmt)

          if newly_stable:
              print()
              print(f"::notice::{sorted(newly_stable)} are now byte-identical "
                    f"across platforms. Consider tightening SPEC N4 and adding "
                    f"them to CROSS_OS_STABLE.")
          if regressed:
              sys.exit(
                  f"{sorted(regressed)} used to be byte-identical across "
                  f"platforms and no longer is -- SPEC N4 relies on it"
              )
          print()
          print("cross-OS state matches what SPEC N4 claims")
          PY

  # PLAN Phase 2 gate: the matplotlib fallback must work where EGL is absent.
  render-fallback:
    name: render fallback (no EGL)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: assert EGL really is unavailable
        run: |
          uv run python - <<'PY'
          from cad_mcp import render
          assert render._check_pyrender() is False, (
              "pyrender initialised — this job is meant to exercise the "
              "matplotlib fallback with EGL absent"
          )
          print("confirmed: EGL unavailable, fallback path under test")
          PY
      - run: uv run pytest tests/test_render.py -q

  # The pyrender path shipped untested and uninstalled (CAD-011).
  render-pyrender:
    name: render (pyrender / osmesa)
    needs: static
    runs-on: ubuntu-latest
    continue-on-error: true  # informational until the GPU path is required
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install OSMesa
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev libgl1 libglu1-mesa freeglut3-dev
        # `--all-extras` already includes `gpu`, and uv refuses the two
        # together: "the argument '--all-extras' cannot be used with
        # '--extra <EXTRA>'". The job never reached pytest.
      - run: uv sync --all-extras
      - name: render via pyrender
        env:
          PYOPENGL_PLATFORM: osmesa
        run: uv run pytest tests/test_render.py -q

  # CAD-012: the declared dependencies must actually be sufficient.
  clean-install:
    name: clean install (no dev deps)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: sync runtime deps only
        run: uv sync --no-dev
      - name: the full loop must work with declared deps alone
        run: uv run python scripts/smoke.py

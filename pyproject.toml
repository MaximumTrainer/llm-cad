[project]
name = "cad-mcp"
version = "0.1.0"
description = "MCP server that lets any LLM design 3D models from text via CadQuery"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8.0",
    "httpx>=0.28",
    "manifold3d>=3.5.2",
    "mcp[cli]>=1.9.0",
    "trimesh>=5.0.0",
]

[project.scripts]
cad-mcp = "cad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["cad_mcp"]
mypy_path = "src"
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["cadquery.*", "OCP.*", "casadi.*", "pyrender.*", "trimesh.*", "manifold3d.*", "scipy.*", "PIL.*", "imagehash.*", "uvicorn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "imagehash>=4.3.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "ruff>=0.16.5",
]

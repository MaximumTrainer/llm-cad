[project]
name = "cad-mcp"
version = "0.1.0"
description = "MCP server that lets any LLM design 3D models from text via CadQuery"
requires-python = ">=3.11"
dependencies = [
    # Geometry kernel. Upper-bounded deliberately: CLAUDE.md warns that
    # rendering and export are version-sensitive, and an unbounded
    # `>=2.8.0` is how a breaking OCP arrives unannounced. Bump via the
    # `pin-bump` skill, which runs the golden and determinism gates.
    "cadquery>=2.8.0,<3",
    # MCP SDK v2. The code uses `MCPServer` and `input_schema`, neither of
    # which exists in v1, so the old `>=1.9.0` range could resolve to
    # something that fails at import.
    "mcp[cli]>=2.0,<3",
    # Mesh validation and export.
    "manifold3d>=3.5.2,<4",
    "trimesh>=5.0.0,<6",
    # Imported directly by render.py and validate.py. These previously
    # arrived only transitively (cadquery -> vtk -> matplotlib, and
    # cadquery -> scipy), so a VTK restructure would have broken
    # rendering and validation at runtime in a user's session.
    "matplotlib>=3.8",
    # trimesh's ray intersector needs rtree for its bounds tree, and the
    # wall-thickness check casts rays to measure material rather than
    # surface proximity (CAD-015).
    "rtree>=1.1",
    "pillow>=10",
    "scipy>=1.11",
    "numpy>=1.26",
    # HTTP transport and the Meshy client. starlette and uvicorn are
    # imported directly by server.py.
    "httpx>=0.28",
    "starlette>=0.37",
    "uvicorn>=0.30",
    # transport.py imports AnyHttpUrl directly.
    "pydantic>=2.7",
    # trimesh's 3MF exporter needs both of these and declares neither as a
    # hard dependency, so a runtime-only install silently loses a format
    # SPEC G4 advertises: lxml to write the model XML, networkx to walk
    # the scene graph. Both were missing from the container while the dev
    # venv happened to have them, which is exactly the CAD-012 failure
    # mode repeating one layer out.
    "lxml>=6.1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
# The pyrender/EGL renderer. Optional because matplotlib is the supported
# default: pyrender was never installed here, so `_check_pyrender()`
# always returned False and the whole pyrender path had never executed.
gpu = [
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1.0",
]

[project.scripts]
cad-mcp = "cad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Marker semantics. A test carries a marker when it pays that cost, so
# the selections below mean what they say:
#
#   geometry     builds real geometry, so it pays at least one sandbox
#                subprocess (~3.5s cold, less with the warm worker) or a
#                tessellation. Everything under `tests/` that calls
#                `execute_cad` has it.
#   slow         seconds on its own account: perf budgets, resource
#                limits, timeout probes, cross-process determinism.
#   integration  talks to a network service.
#   llm          live LLM calls via OpenRouter; costs money.
#
# An *unmarked* test is the fast tier: no sandbox, no render, no network.
# It covers the response envelope, argument handling, error paths, docs
# consistency and pure helpers via fixtures rather than live runs, and the
# whole tier is expected to stay under 30s.
markers = [
    "geometry: builds real geometry; pays a sandbox subprocess or a tessellation",
    "slow: seconds each on its own account (perf budgets, resource limits, subprocess probes)",
    "integration: talks to a network service",
    "llm: live LLM calls via OpenRouter; needs OPENROUTER_API_KEY, costs money",
    "serial: wall-clock sensitive; skipped under -n >1 and run in a serial pass",
]
#   uv run pytest                            everything except live LLM
#   uv run pytest -m "not geometry and not slow"   the fast tier (<30s)
#   uv run pytest -m llm                     live OpenRouter tests
#   uv run pytest -m serial -n0      the budget/timeout tests
#   uv run pytest -n0                serial, for debugging
#
# `-n auto` is the difference between a suite that runs before a commit
# and one that does not: the work is overwhelmingly independent sandbox
# subprocesses. `worksteal` rather than `load` or `loadfile` because the
# tests are wildly heterogeneous -- 0.01s envelope checks next to 30s
# subprocess probes -- and a static split leaves workers idle while one
# grinds through the long tail. Measured on 12 cores: loadfile 195s,
# worksteal 157s, against a 539s serial baseline (CAD-025).
addopts = "-m 'not llm' -n auto --dist worksteal"

[tool.mypy]
strict = true
packages = ["cad_mcp"]
mypy_path = "src"
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["cadquery.*", "OCP.*", "casadi.*", "pyrender.*", "trimesh.*", "manifold3d.*", "scipy.*", "PIL.*", "imagehash.*", "uvicorn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
src = ["src", "tests"]
# Agent tooling under .claude/ is not part of the shipped package and is
# not held to the package's lint rules; CI lints src/, tests/ and scripts/.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "imagehash>=4.3.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]
